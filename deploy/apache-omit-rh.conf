# Site Apache de l'application (HTTPS obligatoire, y compris sur le réseau interne).
# À copier dans /etc/apache2/sites-available/omit-rh.conf, puis :
#   sudo a2enmod rewrite ssl headers proxy_fcgi setenvif && sudo a2enconf php8.4-fpm
#   sudo a2ensite omit-rh && sudo systemctl reload apache2
# Remplacer rh.omit.local et les chemins des certificats par les valeurs réelles.

<VirtualHost *:80>
    ServerName rh.omit.local
    Redirect permanent / https://rh.omit.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName rh.omit.local
    DocumentRoot /var/www/omit-gestion-personnel/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/omit/rh.omit.local.crt
    SSLCertificateKeyFile /etc/ssl/omit/rh.omit.local.key

    <Directory /var/www/omit-gestion-personnel/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Pièces jointes jusqu'à 5 Mo, imports CSV jusqu'à 2 Mo.
    LimitRequestBody 10485760

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/omit-rh-error.log
    CustomLog ${APACHE_LOG_DIR}/omit-rh-access.log combined
</VirtualHost>
